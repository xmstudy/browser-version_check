<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>版本监听测试页</title>
  <style>
    body { font-family: sans-serif; padding: 40px; }
    #version { font-size: 24px; color: #1677ff; margin: 16px 0; }
    button { padding: 8px 16px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>版本监听插件测试页</h1>
  <p>当前版本：<span id="version">v1.0.0</span></p>
  <button type="button" onclick="bumpVersion()">模拟版本更新</button>
  <script>
    let n = 1;
    function bumpVersion() {
      n++;
      document.getElementById('version').textContent = 'v1.0.' + n;
    }
  </script>
</body>
</html>
